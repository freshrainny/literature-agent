<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: transparent;
    padding: 0;
  }
  .hl-card {
    border-left: 3px solid #c8b89a;
    padding: 10px 14px 0 14px;
    margin: 8px 0 0 0;
    background: #fdfbf7;
    border-radius: 0 6px 0 0;
  }
  .hl-text {
    font-family: 'Georgia', serif;
    font-size: 0.88rem;
    color: #333;
    line-height: 1.65;
    font-style: italic;
  }
  .hl-meta {
    font-size: 0.74rem;
    color: #aaa;
    margin-top: 5px;
  }
  .hl-note {
    font-size: 0.74rem;
    color: #888;
    margin-top: 4px;
  }
  .tag-pill {
    display: inline-block;
    background: #f0eeea;
    color: #666;
    padding: 1px 7px;
    border-radius: 20px;
    font-size: 0.72rem;
    margin: 1px 2px 1px 0;
  }
  /* 操作栏：与卡片融为一体 */
  .hl-actions {
    border-left: 3px solid #c8b89a;
    background: #fdfbf7;
    border-radius: 0 0 6px 0;
    padding: 3px 8px 6px 8px;
    margin: 0 0 4px 0;
    display: flex;
    justify-content: flex-end;
    gap: 5px;
    align-items: center;
  }
  .hl-btn {
    font-size: 0.72rem;
    padding: 2px 10px;
    border: 1px solid #ddd8d0;
    border-radius: 4px;
    background: transparent;
    color: #888;
    cursor: pointer;
    line-height: 1.5;
    transition: all .12s;
  }
  .hl-btn:hover {
    background: #f0ede8;
    color: #555;
    border-color: #c8b89a;
  }
  .hl-btn.del:hover {
    background: #fff0f0;
    color: #d04040;
    border-color: #f0c0c0;
  }
  .empty-tip {
    color: #bbb;
    font-size: 0.82rem;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
var _ready = false;
var _highlights = [];

function _sendMsg(type, data) {
  var msg = Object.assign({isStreamlitMessage: true, type: type}, data || {});
  window.parent.postMessage(msg, '*');
}
function _setValue(val) {
  _sendMsg('streamlit:setComponentValue', {value: val});
}
function _setHeight(h) {
  _sendMsg('streamlit:setFrameHeight', {height: h});
}

window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'streamlit:render') {
    var args = e.data.args || {};
    _highlights = args.highlights || [];
    render();
  }
});

function render() {
  var root = document.getElementById('root');
  if (_highlights.length === 0) {
    root.innerHTML = '<div class="empty-tip">Select text in the PDF to create highlights.</div>';
    _setHeight(50);
    return;
  }
  var html = '';
  _highlights.forEach(function(h) {
    var tags = (h.tags || []).map(function(t) {
      return '<span class="tag-pill">' + esc(t) + '</span>';
    }).join('');
    var note = h.note ? '<div class="hl-note">' + esc(h.note) + '</div>' : '';
    html += '<div class="hl-card">'
      + '<div class="hl-text">' + esc(h.content.substring(0, 200)) + '</div>'
      + '<div class="hl-meta">p.' + (h.page_number || '?') + ' ' + tags + '</div>'
      + note
      + '</div>'
      + '<div class="hl-actions">'
      + '<button class="hl-btn" onclick="jump(' + h.page_number + ')">↗ p.' + (h.page_number || '?') + '</button>'
      + '<button class="hl-btn del" onclick="del(' + h.id + ')" title="Delete">🗑</button>'
      + '</div>';
  });
  root.innerHTML = html;
  _setHeight(root.scrollHeight + 10);
}

function jump(page) {
  _setValue(JSON.stringify({action: 'jump', page: page}));
  setTimeout(function() { _setValue(null); }, 400);
}

function del(id) {
  _setValue(JSON.stringify({action: 'delete', id: id}));
  setTimeout(function() { _setValue(null); }, 400);
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 通知就绪
_sendMsg('streamlit:componentReady', {apiVersion: 1});
</script>
</body>
</html>
